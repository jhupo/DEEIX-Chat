      security:
      - BearerAuth: []
      summary: Remove conversation event runs
      tags:
      - admin
  /admin/llm/model-display-groups:
    get:
      description: 分页查询自定义展示分组；未绑定分组的模型继续按技术厂商展示
      parameters:
      - description: 页码
