        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索 key 或名称
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ModelVendorListResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员查询模型技术厂商
      tags:
      - llm
    post:
      consumes:
      - application/json
      description: 创建新的稳定技术厂商身份；创建后可供平台模型选择
      parameters:
