        "200":
          description: OK
          schema:
            $ref: '#/definitions/ChannelActionResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员删除模型展示分组
      tags:
      - llm
    patch:
      consumes:
      - application/json
      parameters:
      - description: 展示分组 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 展示分组参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateModelDisplayGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ModelDisplayGroupDataResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/ChannelErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员更新模型展示分组
      tags:
      - llm
  /admin/llm/model-vendors:
    get:
      description: 分页查询模型技术厂商目录；技术厂商是路由、权限和计费使用的稳定身份
      parameters:
      - description: 页码
        in: query
