        in: query
        name: page_size
        type: integer
      - description: 搜索名称
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ModelDisplayGroupListResponseDoc'
