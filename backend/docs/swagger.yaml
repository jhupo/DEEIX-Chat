info:
  contact: {}
  description: DEEIX Chat 后端 API 文档
  title: DEEIX Chat API
  version: "0.4.50"
paths:
  /admin/announcements:
    get:
      consumes:
      - application/json
      description: 分页查询站点公告
      parameters:
      - description: 状态：active/inactive
        in: query
        name: status
        type: string
      - description: 类型：critical/warning/info/normal/general
        in: query
        name: type
        type: string
      - description: 是否置顶
        in: query
        name: pinned
        type: boolean
      - description: 搜索关键词
        in: query
        name: q
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AdminAnnouncementListResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员查询公告
      tags:
      - admin-announcements
    post:
      consumes:
      - application/json
      description: 创建一条 Markdown 站点公告
      parameters:
      - description: 公告配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAnnouncementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AnnouncementResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员创建公告
      tags:
      - admin-announcements
  /admin/announcements/{id}:
    delete:
      consumes:
      - application/json
      description: 软删除公告
      parameters:
      - description: 公告ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AnnouncementDeleteResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员删除公告
      tags:
      - admin-announcements
    patch:
      consumes:
      - application/json
      description: 更新公告标题、内容、状态、优先级和有效期
      parameters:
      - description: 公告ID
        in: path
        name: id
        required: true
        type: integer
      - description: 公告更新字段
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/PatchAnnouncementRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AnnouncementResponseDoc'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/AnnouncementErrorDoc'
      security:
      - BearerAuth: []
      summary: 管理员更新公告
      tags:
      - admin-announcements
  /admin/audit-logs:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuditLogListResponseDoc'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - admin
  /admin/conversation-events:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ConversationEventListResponseDoc'
      security:
      - BearerAuth: []
      summary: List conversation events
      tags:
      - admin
  /admin/conversation-events/{id}:
    get:
      parameters:
