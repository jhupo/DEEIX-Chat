name: Workspace Quality

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "Dockerfile"
      - "compose.yaml"
      - "config.example.yaml"
      - "deploy/docker-entrypoint.sh"
      - "deploy/docker-entrypoint.test.sh"
      - "scripts/sync-version.mjs"
      - "VERSION"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "Dockerfile"
      - "compose.yaml"
      - "config.example.yaml"
      - "deploy/docker-entrypoint.sh"
      - "deploy/docker-entrypoint.test.sh"
      - "scripts/sync-version.mjs"
      - "VERSION"
      - ".github/workflows/frontend-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and backend checks
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: deeix
          POSTGRES_PASSWORD: deeix
          POSTGRES_DB: deeix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deeix -d deeix"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEEIX_TEST_DATABASE_DSN: postgres://deeix:deeix@localhost:5432/deeix?sslmode=disable
      DEEIX_TEST_REDIS_ADDR: localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Full Compose configuration
        run: |
          cp config.example.yaml config.yaml
          docker compose -f compose.yaml config -q

      - name: Check Docker runtime activation
        run: sh deploy/docker-entrypoint.test.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

      - name: Run workspace tests
        run: pnpm test
