name: Agent Bridge

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/agent-bridge/**"
      - "docs/agent-runtime/codex-app-server-v0.147.0.lock.json"
      - ".github/workflows/agent-bridge.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/agent-bridge/**"
      - "docs/agent-runtime/codex-app-server-v0.147.0.lock.json"
      - ".github/workflows/agent-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deeix/agent-bridge check
      - run: pnpm --filter @deeix/agent-bridge check:schema
      - name: Download pinned Codex
        shell: pwsh
        run: |
          $asset = "codex-package-x86_64-pc-windows-msvc.tar.gz"
          $url = "https://github.com/openai/codex/releases/download/rust-v0.147.0/$asset"
          Invoke-WebRequest -Uri $url -OutFile $asset
          $actual = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "c156c8feb8cb20197bf74d2c6daffed1fec0a8c21a03bc2ca90d7ff81927b0c5") {
            throw "Pinned Codex SHA-256 mismatch"
          }
          New-Item -ItemType Directory -Force codex-e2e | Out-Null
          tar -xzf $asset -C codex-e2e
          if (-not (Test-Path codex-e2e/bin/codex.exe) -or -not (Test-Path codex-e2e/bin/codex-code-mode-host.exe)) {
            throw "Pinned Codex runtime is incomplete"
          }
          "CODEX_E2E_EXECUTABLE=$((Resolve-Path codex-e2e/bin/codex.exe).Path)" | Out-File $env:GITHUB_ENV -Append
      - run: pnpm --filter @deeix/agent-bridge test
