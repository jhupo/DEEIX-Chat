name: GHCR Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_ghcr_image:
    name: Build image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=ref,event=tag,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  merge:
    name: Merge image
    runs-on: ubuntu-latest
    needs:
      - build_ghcr_image
    if: github.event_name != 'pull_request'

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"

  package_agent:
    name: Package native Agent (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - name: windows-x64
            goos: windows
            goarch: amd64
            asset: deeix-agent-windows-x64.exe
          - name: linux-x64
            goos: linux
            goarch: amd64
            asset: deeix-agent-linux-x64
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            asset: deeix-agent-macos-arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test Agent
        working-directory: backend
        run: go test ./internal/agentclient ./cmd/deeix-agent
      - name: Build native executable
        shell: bash
        run: |
          mkdir -p dist
          version=$(cat VERSION)
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -C backend -trimpath \
            -ldflags="-s -w -X main.version=$version -X main.commit=$GITHUB_SHA" \
            -o "../dist/${{ matrix.asset }}" ./cmd/deeix-agent
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release_application:
    name: Package stable application release
    runs-on: ubuntu-latest
    needs: [merge, package_agent]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Validate stable tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build frontend
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @deeix/web build
      - name: Download native Agent packages
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist
          merge-multiple: true
      - name: Build application bundles
        shell: bash
        run: |
          mkdir -p dist
          version=$(cat VERSION)
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          agent_dir="frontend/out/agent/releases/current"
          mkdir -p "$agent_dir"
          cp dist/deeix-agent-windows-x64.exe* dist/deeix-agent-linux-x64* dist/deeix-agent-macos-arm64* "$agent_dir/"
          for arch in amd64 arm64; do
            root="dist/release-$arch"
            mkdir -p "$root/frontend"
            cp VERSION "$root/VERSION"
            cp -a frontend/out "$root/frontend/out"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -C backend -trimpath \
              -ldflags="-s -w -X github.com/DEEIX-AI/DEEIX-Chat/backend/internal/shared/buildinfo.Version=$version -X github.com/DEEIX-AI/DEEIX-Chat/backend/internal/shared/buildinfo.Commit=$GITHUB_SHA -X github.com/DEEIX-AI/DEEIX-Chat/backend/internal/shared/buildinfo.BuildTime=$build_time" \
              -o "../$root/deeix-chat" ./cmd/server
            tar -C "$root" -czf "dist/deeix-chat-linux-$arch.tar.gz" VERSION deeix-chat frontend
            (cd dist && sha256sum "deeix-chat-linux-$arch.tar.gz" > "deeix-chat-linux-$arch.tar.gz.sha256")
          done
      - name: Generate release manifest
        shell: bash
        run: |
          repo="$GITHUB_REPOSITORY"
          published=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          amd64_sha=$(sha256sum dist/deeix-chat-linux-amd64.tar.gz | awk '{print $1}')
          arm64_sha=$(sha256sum dist/deeix-chat-linux-arm64.tar.gz | awk '{print $1}')
          amd64_size=$(stat -c '%s' dist/deeix-chat-linux-amd64.tar.gz)
          arm64_size=$(stat -c '%s' dist/deeix-chat-linux-arm64.tar.gz)
          base="https://github.com/$repo/releases/download/$GITHUB_REF_NAME"
          cat > dist/update-manifest.json <<EOF
          {"schemaVersion":2,"repository":"$repo","tag":"$GITHUB_REF_NAME","version":"${GITHUB_REF_NAME#v}","commit":"$GITHUB_SHA","publishedAt":"$published","releaseURL":"https://github.com/$repo/releases/tag/$GITHUB_REF_NAME","bundles":[{"platform":"linux/amd64","url":"$base/deeix-chat-linux-amd64.tar.gz","sha256":"sha256:$amd64_sha","size":$amd64_size},{"platform":"linux/arm64","url":"$base/deeix-chat-linux-arm64.tar.gz","sha256":"sha256:$arm64_sha","size":$arm64_size}]}
          EOF
          (cd dist && sha256sum update-manifest.json > update-manifest.json.sha256)
      - name: Generate release notes
        shell: bash
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous_tag:+$previous_tag..}$GITHUB_REF_NAME
          mapfile -t subjects < <(git log --reverse --format='%s' "$range")
          features=()
          fixes=()
          changes=()
          docs=()
          engineering=()
          for subject in "${subjects[@]}"; do
            case "$subject" in
              feat:*|feat\(*\):*) features+=("$subject") ;;
              fix:*|fix\(*\):*) fixes+=("$subject") ;;
              perf:*|perf\(*\):*|refactor:*|refactor\(*\):*) changes+=("$subject") ;;
              docs:*|docs\(*\):*) docs+=("$subject") ;;
              *) engineering+=("$subject") ;;
            esac
          done
          emit_section() {
            local title=$1
            shift
            [ "$#" -eq 0 ] || {
              printf '## %s\n\n' "$title"
              printf -- '- %s\n' "$@"
              printf '\n'
            }
          }
          {
            printf 'DEEIX Chat %s 稳定版。\n\n' "${GITHUB_REF_NAME#v}"
            emit_section '新增' "${features[@]}"
            emit_section '修复' "${fixes[@]}"
            emit_section '修改' "${changes[@]}"
            emit_section '文档' "${docs[@]}"
            emit_section '工程与测试' "${engineering[@]}"
            printf '## 发布内容\n\n'
            printf -- '- Full 应用包：Linux amd64、Linux arm64\n'
            printf -- '- 原生 Agent：Windows x64、Linux x64、macOS arm64\n'
            printf -- '- 所有包均附带 SHA-256 校验文件\n'
            printf -- '- 管理员可在后台检查并在线更新 Docker 中的应用运行时\n\n'
            if [ -n "$previous_tag" ]; then
              printf '**完整变更**：https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME"
            fi
          } > dist/release-notes.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/update-manifest.json dist/update-manifest.json.sha256 dist/deeix-chat-linux-*.tar.gz dist/deeix-chat-linux-*.tar.gz.sha256 dist/deeix-agent-windows-x64.exe* dist/deeix-agent-linux-x64* dist/deeix-agent-macos-arm64* --clobber
