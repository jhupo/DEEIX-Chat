name: GHCR Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_ghcr_image:
    name: Build image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=ref,event=tag,suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  merge:
    name: Merge image
    runs-on: ubuntu-latest
    needs:
      - build_ghcr_image
    if: github.event_name != 'pull_request'

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          image_name=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$image_name" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"

  package_agent_bridge:
    name: Package Agent Bridge (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
            archive: zip
          - name: linux-x64
            runner: ubuntu-24.04
            archive: tar
          - name: macos-arm64
            runner: macos-15
            archive: tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deeix/agent-bridge check:schema
      - run: pnpm --filter @deeix/agent-bridge test
      - name: Assemble Windows bundle
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $root = "dist/deeix-agent-bridge-${{ matrix.name }}"
          New-Item -ItemType Directory -Force "$root/dist" | Out-Null
          Copy-Item (Get-Command node).Source "$root/node.exe"
          Copy-Item packages/agent-bridge/dist/src "$root/dist/src" -Recurse
          Set-Content "$root/package.json" '{"private":true,"type":"module"}' -Encoding ascii
          @('@echo off', '"%~dp0node.exe" "%~dp0dist\src\cli.js" %*') | Set-Content "$root/deeix-agent-bridge.cmd" -Encoding ascii
          Compress-Archive "$root/*" "dist/deeix-agent-bridge-${{ matrix.name }}.zip"
          (Get-FileHash "dist/deeix-agent-bridge-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant() + "  deeix-agent-bridge-${{ matrix.name }}.zip" | Set-Content "dist/deeix-agent-bridge-${{ matrix.name }}.zip.sha256" -Encoding ascii
      - name: Assemble Unix bundle
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          root="dist/deeix-agent-bridge-${{ matrix.name }}"
          mkdir -p "$root/dist"
          cp "$(command -v node)" "$root/node"
          cp -a packages/agent-bridge/dist/src "$root/dist/src"
          printf '%s\n' '{"private":true,"type":"module"}' > "$root/package.json"
          printf '%s\n' '#!/bin/sh' 'DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' 'exec "$DIR/node" "$DIR/dist/src/cli.js" "$@"' > "$root/deeix-agent-bridge"
          chmod 755 "$root/node" "$root/deeix-agent-bridge"
          tar -C "$root" -czf "dist/deeix-agent-bridge-${{ matrix.name }}.tar.gz" node deeix-agent-bridge package.json dist
          (cd dist && shasum -a 256 "deeix-agent-bridge-${{ matrix.name }}.tar.gz" > "deeix-agent-bridge-${{ matrix.name }}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-${{ matrix.name }}
          path: |
            dist/deeix-agent-bridge-${{ matrix.name }}.zip
            dist/deeix-agent-bridge-${{ matrix.name }}.zip.sha256
            dist/deeix-agent-bridge-${{ matrix.name }}.tar.gz
            dist/deeix-agent-bridge-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release_application:
    name: Package stable application release
    runs-on: ubuntu-latest
    needs: [merge, package_agent_bridge]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Validate stable tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Build frontend
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @deeix/web build
      - name: Download Agent Bridge bundles
        uses: actions/download-artifact@v4
        with:
          pattern: agent-bridge-*
          path: dist
          merge-multiple: true
      - name: Build application bundles
        shell: bash
        run: |
          mkdir -p dist
          version=$(cat VERSION)
          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          bridge_dir="frontend/out/agent/releases/current"
          mkdir -p "$bridge_dir"
          cp dist/deeix-agent-bridge-*.zip* dist/deeix-agent-bridge-*.tar.gz* "$bridge_dir/"
          for arch in amd64 arm64; do
            root="dist/release-$arch"
            mkdir -p "$root/frontend"
            cp VERSION "$root/VERSION"
            cp -a frontend/out "$root/frontend/out"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -C backend -trimpath \
              -ldflags="-s -w -X github.com/DEEIX-AI/DEEIX-Chat/backend/internal/shared/buildinfo.Version=$version -X github.com/DEEIX-AI/DEEIX-Chat/backend/internal/shared/buildinfo.Commit=$GITHUB_SHA -X github.com/DEEIX-AI/DEEIX-Chat/backend/internal/shared/buildinfo.BuildTime=$build_time" \
              -o "../$root/deeix-chat" ./cmd/server
            tar -C "$root" -czf "dist/deeix-chat-linux-$arch.tar.gz" VERSION deeix-chat frontend
            (cd dist && sha256sum "deeix-chat-linux-$arch.tar.gz" > "deeix-chat-linux-$arch.tar.gz.sha256")
          done
      - name: Generate release manifest
        shell: bash
        run: |
          repo="$GITHUB_REPOSITORY"
          published=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          amd64_sha=$(sha256sum dist/deeix-chat-linux-amd64.tar.gz | awk '{print $1}')
          arm64_sha=$(sha256sum dist/deeix-chat-linux-arm64.tar.gz | awk '{print $1}')
          amd64_size=$(stat -c '%s' dist/deeix-chat-linux-amd64.tar.gz)
          arm64_size=$(stat -c '%s' dist/deeix-chat-linux-arm64.tar.gz)
          base="https://github.com/$repo/releases/download/$GITHUB_REF_NAME"
          cat > dist/update-manifest.json <<EOF
          {"schemaVersion":2,"repository":"$repo","tag":"$GITHUB_REF_NAME","version":"${GITHUB_REF_NAME#v}","commit":"$GITHUB_SHA","publishedAt":"$published","releaseURL":"https://github.com/$repo/releases/tag/$GITHUB_REF_NAME","bundles":[{"platform":"linux/amd64","url":"$base/deeix-chat-linux-amd64.tar.gz","sha256":"sha256:$amd64_sha","size":$amd64_size},{"platform":"linux/arm64","url":"$base/deeix-chat-linux-arm64.tar.gz","sha256":"sha256:$arm64_sha","size":$arm64_size}]}
          EOF
          (cd dist && sha256sum update-manifest.json > update-manifest.json.sha256)
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/update-manifest.json dist/update-manifest.json.sha256 dist/deeix-chat-linux-*.tar.gz dist/deeix-chat-linux-*.tar.gz.sha256 dist/deeix-agent-bridge-*.zip* dist/deeix-agent-bridge-*.tar.gz* --clobber
